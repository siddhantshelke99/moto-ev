<section class="page-wrap">
  <div class="gallery-hero">
    <div>
      <p>Media</p>
      <h1>VoltRide Visual Gallery</h1>
      <span>Explore product visuals, campaign frames, and real-world riding moments.</span>
    </div>
    <div class="hero-preview">
      <img [src]="items[0].image" [alt]="items[0].title" />
    </div>
  </div>

  <app-gallery-grid [items]="items" (preview)="openLightbox($event)"></app-gallery-grid>
</section>

@if (selectedItem(); as current) {
  <div class="lightbox" (click)="closeLightbox()">
    <div class="lightbox-card" (click)="$event.stopPropagation()">
      <div class="head">
        <span>{{ current.tag }}</span>
        <h3>{{ current.title }}</h3>
      </div>
      <div class="preview">
        <img [src]="current.image" [alt]="current.title" />
      </div>
      <button type="button" (click)="closeLightbox()">Close Preview</button>
    </div>
  </div>
}
