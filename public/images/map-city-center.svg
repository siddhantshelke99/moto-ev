<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='800' viewBox='0 0 1200 800'>
  <defs>
    <linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0%' stop-color='#334155' />
      <stop offset='100%' stop-color='#1e293b' />
    </linearGradient>
    <filter id='noise'>
      <feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch' />
      <feColorMatrix type='saturate' values='0' />
      <feComponentTransfer><feFuncA type='table' tableValues='0 0.08'/></feComponentTransfer>
    </filter>
  </defs>
  <rect width='1200' height='800' fill='url(#g)' />
  <rect width='1200' height='800' filter='url(#noise)' />
  <circle cx='980' cy='120' r='180' fill='rgba(255,255,255,0.18)' />
  <circle cx='220' cy='700' r='240' fill='rgba(255,255,255,0.12)' />
  <rect x='90' y='110' width='1020' height='580' rx='28' fill='rgba(0,0,0,0.14)' stroke='rgba(255,255,255,0.3)' />
  <text x='130' y='240' font-family='Segoe UI, sans-serif' font-size='68' font-weight='700' fill='white'>City Center Dealer</text>
  <text x='130' y='300' font-family='Segoe UI, sans-serif' font-size='30' font-weight='500' fill='rgba(255,255,255,0.9)'>Map Preview</text>
</svg>
